name: Quality checks

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python source
        run: python -m compileall -q agents api configs env tests utils
      - name: Run deterministic environment and memory tests
        run: python -m pytest -q tests

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Test frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        run: npm run build
