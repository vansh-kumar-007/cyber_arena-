name: Quality checks

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q agents api configs env tests utils main.py train_dqn.py evaluate_dqn.py
      - name: Run deterministic environment and memory tests
        run: python -m pytest -q tests

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Test frontend
        run: npm test -- --watchAll=false
      - name: Build frontend
        run: npm run build

  frontend-security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Record npm audit findings without hiding existing failures
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit=$?
          set -e
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const counts = report.metadata?.vulnerabilities || {};
          console.log("=== FRONTEND NPM AUDIT COUNTS ===");
          console.log(JSON.stringify(counts, null, 2));
          console.log("=== VULNERABLE PACKAGE SUMMARY ===");
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: (item.via || []).filter(v => typeof v === "object").map(v => ({
                title: v.title, url: v.url, range: v.range
              }))
            }));
          }
          NODE
          echo "npm audit exit code: $audit_exit (nonzero is expected while findings remain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-npm-audit
          path: frontend/npm-audit.json
          if-no-files-found: error
          retention-days: 14

  ml-training-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy and CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify one small training episode
        run: python -m pytest -q tests/test_dqn_smoke.py
