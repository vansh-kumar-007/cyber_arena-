name: Reproducible policy evaluation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "agents/**"
      - "configs/**"
      - "env/**"
      - "evaluate_dqn.py"
      - "scripts/run_policy_evaluation.py"
      - "train_dqn.py"
      - "utils/**"
      - ".github/workflows/policy-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run paired-seed baseline-vs-trained experiment
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONHASHSEED: "20261010"
        run: |
          python scripts/run_policy_evaluation.py \
            --seed 20261010 \
            --train-episodes 100 \
            --eval-episodes 100 \
            --output artifacts/policy-evaluation.json \
            --work-dir artifacts/policy-evaluation-work
      - name: Upload evaluation report and reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberarena-policy-evaluation
          path: |
            artifacts/policy-evaluation.json
            artifacts/policy-evaluation-work/**/*.pt
            artifacts/policy-evaluation-work/agent-memory.sqlite3*
          if-no-files-found: warn
          retention-days: 30
